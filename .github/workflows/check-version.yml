name: Check The Dude version

on:
  workflow_dispatch:
    inputs:
      force_download_test:
        description: 'Force installer download test'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 1 * * 1'
      timezone: 'Europe/Vilnius'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check latest MikroTik stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)

          LATEST_VERSION=$(curl -fsSL \
            https://upgrade.mikrotik.com/routeros/NEWESTa7.stable \
            | awk '{print $1}')

          if [ -z "$LATEST_VERSION" ]; then
            echo "::error::Could not determine latest MikroTik version"
            exit 1
          fi

          echo "Current PKGBUILD version: $CURRENT_VERSION"
          echo "Latest MikroTik version:   $LATEST_VERSION"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            echo "The Dude PKGBUILD is up to date."
          else
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New The Dude version available: $CURRENT_VERSION -> $LATEST_VERSION"
          fi

      - name: Download The Dude installer and calculate SHA256
        if: steps.version.outputs.update_available == 'true' || inputs.force_download_test == true
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.latest_version }}
        run: |
          set -euo pipefail

          URL="https://download.mikrotik.com/routeros/${VERSION}/dude-install-${VERSION}.exe"
          FILE="dude-install-${VERSION}.exe"

          echo "Downloading: $URL"
          curl -fL "$URL" -o "$FILE"

          SHA256=$(sha256sum "$FILE" | awk '{print $1}')

          echo "Downloaded file: $FILE"
          echo "File size: $(stat -c%s "$FILE") bytes"
          echo "SHA256: $SHA256"
